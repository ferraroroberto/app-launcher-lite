[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Per-test wall-clock cap (#184). Generous vs the ~20 s e2e boot + slowest
# test; a genuinely hung test aborts with a stack dump instead of wedging the
# whole job. thread method is the Windows-safe one (no SIGALRM).
timeout = 120
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
markers =
    smoke: end-to-end browser tests (tests/e2e; require live tray on 8465)
    serial: load-sensitive e2e tests the gate runs after its parallel workers, never among them (#1231)
    windows_only: needs Windows-desktop state (ConPTY session-host, pywin32 desktop control, the tray, PowerShell/.bat recipes, drive-letter paths); the Mac nightly's unit leg deselects it with -m "not windows_only", the local gate still runs it
    iphone: keep this e2e test on the WebKit/iPhone projection too; unmarked browser tests run on Chromium only (#1220)
