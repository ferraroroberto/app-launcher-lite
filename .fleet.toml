# [design] wide_views -- tabs whose content is two-dimensional (the Board's lanes) may
# span the window; every other tab keeps the 772px measure. design.md Layout:
# width follows the shape of the view (fleet-config#1113).
[design]
wide_views = ["board"]

# [design.review] -- the rendered design review's walk (fleet-config
# skills/_lib/design_review, docs/skills.md "Two legs, two interpreters").
# The walk clicks the primary tabs, opens every <details> and showModal()s
# every dialog[id] on its own; each extra step below is a click (or a short
# `clicks` sequence) after a fresh load, never a fill or submit, and never on
# or inside a no_go selector. A step whose target is missing on the live app
# (an empty list) is recorded STEP_TARGET_ABSENT and leaves unrelated rules
# alone (fleet-config#995). Anything inside the session overlay needs a
# session the walk must never attach to on the live app: those steps are
# `synthetic = true` and run only against the throwaway instance below.
[design.review]
theme_storage_key = "app-launcher.theme"
# No tab_selector: the walk resolves it *inside* the first [role=tablist], so
# the default [role=tab] is right and "[role=tablist] [role=tab]" matches
# nothing (every tab click timed out on the first run with it).
# Never clicked: every danger item (Kill, Stop, Delete, Remove), every row
# tap (launches an agent or opens an app), anything that sends, dispatches,
# runs, starts or resumes (a Life skill's Telegram items start or open a
# real bot), and card taps that open a URL.
no_go = [
    ".row-menu-danger",
    ".action-row-main",
    ".session-open",
    ".job-run-btn",
    ".board-open-chat",
    ".board-open-terminal",
    ".board-stop-btn",
    ".board-issue-btn",
    ".board-item:not([data-session-id]) .board-card",
    "#boardDispatchSend",
    "#boardChiefStart",
    "#boardChiefResume",
    "#codingChiefStart",
    "#codingChiefResume",
    "#claudeResume",
    "#lifeOsRecapLaunch",
    "#lifeOsResume",
    ".lifeos-channel-btn",
]

[[design.review.extra_steps]]
tab = "claude"
id = "settings"
click = "#settingsOpen"

[[design.review.extra_steps]]
tab = "claude"
id = "session-menu"
click = "#sessionsList .session-kebab"

[[design.review.extra_steps]]
tab = "board"
id = "drawer"
click = ".board-item[data-session-id] .board-card"

[[design.review.extra_steps]]
tab = "lifeos"
id = "skill-menu"
click = ".lifeos-menu-anchor"

# A skill's conversations (#1504) read its private index, so these two run on
# the synthetic instance only; the chevron opens the conversation sheet
# (a row's main tap stays in no_go).
[[design.review.extra_steps]]
tab = "lifeos"
id = "conversations"
clicks = [".lifeos-menu-anchor", ".lifeos-convo-btn"]
synthetic = true

[[design.review.extra_steps]]
tab = "lifeos"
id = "conversation-sheet"
clicks = [".lifeos-menu-anchor", ".lifeos-convo-btn", ".lifeos-convo-chevron"]
synthetic = true

[[design.review.extra_steps]]
tab = "jobs"
id = "job-menu"
click = ".job-menu-anchor"

[[design.review.extra_steps]]
tab = "jobs"
id = "filter"
click = "#jobsSearchInput"

# `measure --e2e` runs the e2e suite with the surface() hook armed (#1698). A bare
# run would meet the live-tray guard (it refuses while :8465 is occupied), so
# autoboot is explicit; the suite then boots its own disposable webapp + session-host.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 1500

[[design.review.extra_steps]]
tab = "board"
id = "session-chat"
clicks = [".board-item[data-session-id] .board-card", ".board-open-chat"]
synthetic = true

[[design.review.extra_steps]]
tab = "board"
id = "session-terminal"
clicks = [".board-item[data-session-id] .board-card", ".board-open-terminal"]
synthetic = true

[[design.review.extra_steps]]
tab = "board"
id = "session-overlay-menu"
clicks = [".board-item[data-session-id] .board-card", ".board-open-terminal", "#terminalMenu"]
synthetic = true

# [[design.accepted]] -- /design-review rubric findings examined and accepted
# for this repo (fleet-config#974; schema in fleet-config's
# architecture/README.md). Each suppresses one rule in the managed
# design-review issue, listed under "## Accepted" instead of "## Findings".
# Roberto's #1238 decisions, 2026-09-25.
[[design.accepted]]
rule   = "LAYOUT-02"
reason = "the Board's repo filter in the dispatch bar covers the long list, and Backlog starts folded on the phone"
record = "https://github.com/ferraroroberto/app-launcher/issues/1238#issuecomment-5837905876"

[[design.accepted]]
rule   = "LAYOUT-05"
reason = "the Chat turn header's copy button stops propagation, and moving it into the body would force opening a turn to copy it"
record = "https://github.com/ferraroroberto/app-launcher/issues/1238#issuecomment-5837905876"

# design-lint contract findings (/design-sync, #1634) examined and accepted: neither
# dialog is an editor modal, and the look stays as it is. The lint ignores the line
# number after the target path when it matches an entry (fleet-config#1475), so an edit
# to the fragment above either dialog does not break the match.
[[design.accepted]]
check  = "modal-footer"
target = "app/webapp/static/views/shared-dialogs.html"
detail = "editor-modal footer contract violated (design.md modal wants exactly one full-width solid-accent primary): app/webapp/static/views/shared-dialogs.html:15 primary not the solid-accent primary recipe"
reason = "#confirmDialog is the Stop/Remove confirm, a destructive action: its sole action deliberately uses the danger tint, not the solid-accent primary"
record = "https://github.com/ferraroroberto/app-launcher/issues/1634"

[[design.accepted]]
check  = "modal-top-anchor"
target = "app/webapp/static/views/coding-dialogs.html"
detail = "editor-modal(s) with no max-height + internal scroll — a tall form jumps as conditional rows toggle (design.md modal: top-anchored on mobile): app/webapp/static/views/coding-dialogs.html:4"
reason = "#screenView is the full-viewport Screen viewer (inset 0, 100dvh), not an editor modal: its one field is the hidden key-capture input, so no conditional rows can make it jump"
record = "https://github.com/ferraroroberto/app-launcher/issues/1634"

