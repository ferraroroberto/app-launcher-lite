# .fleet.toml — this repo's architecture-map card.
# Lite fork: GitHub Copilot CLI + GitLab (glab) edition of app-launcher for a
# work environment. Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🚀"
port         = ":8455"
display_name = "App Launcher Lite"
description  = "<b>App Launcher Lite</b> — phone-first launcher hub, Copilot + GitLab lite fork of app-launcher. Coding (Copilot CLI PTY sessions) · Apps · Jobs · Team OS · Board (GitLab kanban) · Settings, all from the phone."

[vendored]
switch = { src = "app/webapp/static/_vendored/switch", sha = "da39e1b175a5816e22fb664951084601e247ec1f", dest = "app/webapp/static/_vendored/switch" }
browser_sweep = { src = "tests/e2e/_browser_sweep.py", sha = "60dc05f990bfdd0b479179f02f6e5e0e0c53a7f3", dest = "tests/e2e/_browser_sweep.py" }
