# .fleet.toml — this repo's architecture-map card.
# Lite fork: GitHub Copilot CLI + GitLab (glab) edition of app-launcher.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🚀"
port         = ":8465"
display_name = "App Launcher Lite"
description  = "Copilot + GitLab lite fork of app-launcher: the phone-first launcher hub."

[vendored]
switch = { src = "app/webapp/static/_vendored/switch", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app/webapp/static/_vendored/switch" }
button = { src = "app/webapp/static/_vendored/button", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/button" }
browser_sweep = { src = "tests/e2e/_browser_sweep.py", sha = "60dc05f990bfdd0b479179f02f6e5e0e0c53a7f3", dest = "tests/e2e/_browser_sweep.py" }
nav = { src = "app/webapp/static/_vendored/nav", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/nav" }
home-head = { src = "app/webapp/static/_vendored/home-head", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/home-head" }
card = { src = "app/webapp/static/_vendored/card", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/card" }
disclosure = { src = "app/webapp/static/_vendored/disclosure", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/disclosure" }
icon-button = { src = "app/webapp/static/_vendored/icon-button", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/icon-button" }
notify = { src = "src/notify", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "src/notify" }

[[design.accepted]]
check  = "vendored-tokens"
reason = "vendored components read tokens the app never defines (nav geometry, --layout-*, icon-button --hit-min) and fall back to their own defaults, which are the intended values (#47)"

[[design.accepted]]
check  = "rendered-leg"
reason = "tests/e2e/_geometry.py is not adopted: it would grow the e2e suite and the lite fork stays small (#47)"
