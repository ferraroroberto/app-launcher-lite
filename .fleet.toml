# .fleet.toml — this repo's architecture-map card.
# Lite fork: GitHub Copilot CLI + GitLab (glab) edition of app-launcher.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🚀"
port         = ":8465"
display_name = "App Launcher Lite"
description  = "Copilot + GitLab lite fork of app-launcher: the phone-first launcher hub."
# Root layout (scripts/structure_ratchet.py): the webapp-tray preset lists app, src,
# tests, docs, scripts, data, brand, assets and config; `webapp/` is the one declared
# extra root: the tray-owned webapp's runtime-state folder, which also tracks two
# sample files. Why: docs/layout.md.
shape        = "webapp-tray"
extra_roots  = ["webapp"]

[vendored]
switch = { src = "app/webapp/static/_vendored/switch", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app/webapp/static/_vendored/switch" }
button = { src = "app/webapp/static/_vendored/button", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/button" }
browser_sweep = { src = "tests/e2e/_browser_sweep.py", sha = "60dc05f990bfdd0b479179f02f6e5e0e0c53a7f3", dest = "tests/e2e/_browser_sweep.py" }
nav = { src = "app/webapp/static/_vendored/nav", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/nav" }
home-head = { src = "app/webapp/static/_vendored/home-head", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/home-head" }
card = { src = "app/webapp/static/_vendored/card", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/card" }
disclosure = { src = "app/webapp/static/_vendored/disclosure", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "app/webapp/static/_vendored/disclosure" }
icon-button = { src = "app/webapp/static/_vendored/icon-button", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/icon-button" }
segmented = { src = "app/webapp/static/_vendored/segmented", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/segmented" }
text-size = { src = "app/webapp/static/_vendored/text-size", sha = "59ae763c4dea588aef07a66c236ee3e57c8459ac", dest = "app/webapp/static/_vendored/text-size" }
notify = { src = "src/notify", sha = "aa820f1215151087588433f290cd2ba55b34658d", dest = "src/notify" }
build_info = { src = "src/build_info.py", sha = "c9e54e917fd3cbc96011d6c09f9d363af460b205", dest = "src/build_info.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "f0e6f5449ecf64c9b188ed394c2a9fd8ff678406", dest = "scripts/static_ratchet.py" }
