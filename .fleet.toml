# [e2e] -- diff-proportionate routing for scripts/verify-before-ship.ps1's browser
# phase. scripts/classify_e2e.py is project-scaffolding's classifier, vendored
# byte-for-byte; every routing decision for this repo lives here. Schema:
# project-scaffolding docs/e2e-routing.md. Rules are tried top to bottom, first
# match wins; a path no rule matches is "unclassified" and runs the whole suite, so
# uncertainty escalates and never narrows. Backend src/ Python off the session-host
# path is "none" on purpose (the non-e2e pytest suite covers it); do not route all of
# src/ to full. tests/unit/tooling/test_classify_e2e.py pins this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers      = ["chromium"]
full_pytest_target   = "tests/e2e"

# Inert static assets: the Chromium smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]
label      = "static-asset"
# A vendored HTML fragment (the icons sprite) is markup the smoke suite loads; real
# pages (index.html) and everything else under static/ are browser code.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]
label      = "static-asset"
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/static/"
label  = "webapp-static-code"
# The session-host package sits inside app/webapp/, so its rule comes first and the
# diff keeps the "session-host" label.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/session_host/"
label  = "session-host"
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
label  = "webapp"
[[e2e.rule]]
tier  = "full"
path  = "src/session_client.py"
label = "session-host/launcher"
[[e2e.rule]]
tier  = "full"
path  = "src/launcher.py"
label = "session-host/launcher"
[[e2e.rule]]
tier  = "full"
path  = "launcher.py"
label = "session-host/launcher"
[[e2e.rule]]
tier       = "full"
prefix     = "src/session_host"
extensions = ["py"]
label      = "session-host/launcher"
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
label  = "e2e-test"
[[e2e.rule]]
tier  = "full"
path  = "tests/conftest.py"
label = "shared-conftest"
# The screenshot comparison is proven by a browser run, so it is a browser surface
# despite living under scripts/. Must precede the scripts/ rule.
[[e2e.rule]]
tier  = "full"
path  = "scripts/shot_baseline.py"
label = "shot-baseline"
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
label      = "backend-python"
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
label      = "non-e2e-test"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
label      = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
label  = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
label  = "tooling/config"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
label  = "tooling/config"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
label  = "tooling/config"
[[e2e.rule]]
tier       = "none"
extensions = ["bat"]
label      = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".fleet.toml"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".gitignore"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "LICENSE"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "AGENTS.md"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "CLAUDE.md"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".static-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".docs-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".comment-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".instruction-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".doc-refs-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".dead-code-ratchet-baseline.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".conventions-ratchet-baseline.json"
label = "repo-meta"

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet_gate.py, which wraps
# scripts/static_ratchet.py: it fails on a duplicate block (jscpd via npx, Python and
# JS), an unused import/variable (ruff F401,F841) or a likely bug / security
# finding (curated ruff B and S rules, S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector
# that cannot run exits 3, which fails the gate as NOT CONFIRMED. Vendored copies are
# duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate runs
# scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py: README.md past its
# size budget or baselined size, or a new history marker (issue reference, dated
# heading, changelog heading) in README.md or docs/**/*.md that is not in
# .docs-ratchet-baseline.json, fails. No generated or dated report folder exists
# under docs/, so nothing is excluded. Exit 3 (a file could not be read) fails as
# NOT CONFIRMED. Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet structure check. The gate
# runs scripts/structure_ratchet.py through scripts/structure_ratchet_gate.py: a file
# past 1,000 lines, a Python/JS function past 100, a directory past 40 modules or a
# src -> app import that is not in .structure-ratchet-baseline.json (or that grew past
# its baselined size) fails, and so does a root folder outside the `shape` above. Every
# offender is baselined at its size today; nothing is excluded to shrink the baseline
# (vendored copies are excluded by the script itself). Exit 3 (part of the tree could
# not be measured) fails as NOT CONFIRMED. Procedure + limits: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet check on issue references
# (`#NNN`) inside product-code comments. The gate runs scripts/comment_ratchet.py
# through scripts/comment_ratchet_gate.py: a file whose count of references in
# comments rose, or a new file carrying any, fails against
# .comment-ratchet-baseline.json. A comment states the present-tense why; the story
# of how the code got here lives in the issue and `git log`. Product code only:
# tests, vendored components and generated files are left out by the script itself.
# Exit 3 (a file could not be scanned) fails as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled         = true
baseline        = ".comment-ratchet-baseline.json"
history_phrases = true
docstrings      = true

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet check on the agent
# instruction files (CLAUDE.md, AGENTS.md, .claude/rules/*.md, every SKILL.md and the
# docs a skill links to). The gate runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py: a rule hit of the weekly prompt audit's
# deterministic tier (R-01 to R-12, R-14 size caps, R-15 to R-17, R-30, R-34 to R-36,
# R-45) that rose above .instruction-ratchet-baseline.json, or a file past its size
# cap, fails. Existing hits are baselined, never excluded. Exit 3 (a file could not be
# read or a skill description could not be parsed) fails as NOT CONFIRMED. Procedure +
# limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled             = true
baseline            = ".instruction-ratchet-baseline.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check on references in
# README.md, CLAUDE.md and docs/**/*.md. The gate runs scripts/doc_refs_ratchet.py
# through scripts/doc_refs_ratchet_gate.py: a repo path, `python -m` module, relative
# link or loopback port named in those docs that does not exist, and is not in
# .doc-refs-ratchet-baseline.json, fails. Exit 3 (git unusable, a file that is not
# UTF-8, or a fence that never closes) fails as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/doc-refs-ratchet.md.
# allow_refs: the session-host port. The docs name it on purpose and the app's own
# `port` above is the webapp's :8465, the only port the ratchet resolves by itself.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8466"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check for a function, class
# or method that nothing in the repo refers to. The gate runs
# scripts/dead_code_ratchet.py through scripts/dead_code_ratchet_gate.py: a new
# definition no tracked Python file names, beyond .dead-code-ratchet-baseline.json,
# fails. Route handlers, `__all__`, tests, fixtures and decorated hooks are entry points
# the script knows; vendored copies are read for references but never reported. Whole
# tree, never diff-routed: deleting the last caller in one file strands a definition in
# another. Exit 3 (git unusable, or a .py file that cannot be read or parsed) fails as
# NOT CONFIRMED. Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet check on fleet conventions
# held as stdlib `ast` rules. The gate runs scripts/conventions_ratchet.py through
# scripts/conventions_ratchet_gate.py: a file whose hit count for an enabled rule rose
# above .conventions-ratchet-baseline.json fails. Whole tree, never diff-routed. Exit 3
# (git unusable, or a tracked .py file that cannot be read or parsed) fails as NOT
# CONFIRMED. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
# Rules: no-window (a Windows-only app spawning CLIs from a console-less tray),
# logging-not-print (src/ and app/ are library code), no-drive-path (paths come from
# config), secret-compare (src/api_tokens.py owns the one constant-time compare) and
# git-wrapper (src/git_run.py owns every git spawn) and password-input-vendored (the
# one password input lives in _vendored/sign-in/) and login-lockout (the login route
# answers 429 after repeated wrong passwords, via the vendored src/login_lockout.py).
[conventions_ratchet]
enabled        = true
baseline       = ".conventions-ratchet-baseline.json"
rules          = ["no-window", "logging-not-print", "no-drive-path", "secret-compare", "git-wrapper", "password-input-vendored", "login-lockout", "no-pwsh-stub", "subprocess-timeout", "state-literal", "state-set-repeat", "state-write"]
secret_helpers = ["src/api_tokens.py"]
git_wrappers   = ["src/git_run.py"]

# Outbound HTTP goes through the pooled session, not a bare requests call.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/_loopback_http.py"]
why    = "CLAUDE.md: outbound-connection discipline, one pooled session (src/_loopback_http.py is this repo's pooled loopback session)"
paths  = ["app/", "src/"]

# A raw connect skips the WAL and foreign-key pragmas; a raw replace skips the tmp-file swap.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/runtime_files.py"]
why    = "src/runtime_files.py opens every SQLite file behind its code-folder guard; src/jobs/index.py sets WAL, foreign keys and timeout on the one database"

[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/_json_io.py"]
why    = "src/_json_io.py is the one atomic-write helper (write-tmp + replace)"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]

# [shot_baseline] -- the scaffold's screenshot baseline. The last stage of
# scripts/verify-before-ship.ps1 runs scripts/shot_baseline.py, which compares the
# PNGs tests/e2e/screens/test_screen_shots.py recaptures (the five work tabs at phone and
# desktop width, light and dark; fictional fixture data, Chromium only) with the ones
# committed under `shots_dir`, fails on a visible change and restores the tree.
# `capture` is the argv after the interpreter. Contract and re-baseline steps:
# project-scaffolding docs/playwright-ui-testing.md ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/screens/test_screen_shots.py", "-q", "-p", "no:cacheprovider"]

[[design.accepted]]
check  = "vendored-tokens"
reason = "vendored components read tokens the app never defines (nav geometry, --layout-*, icon-button --hit-min) and fall back to their own defaults, which are the intended values (#47)"

[[design.accepted]]
check  = "rendered-leg"
reason = "tests/e2e/_geometry.py is not adopted: it would grow the e2e suite and the lite fork stays small (#47)"

# [[state_machines]] -- the Jobs run lifecycle, declared once. src/jobs/run_state.py owns
# the RunState enum and the one derive function; the conventions ratchet's state rules stop
# reporting that module and keep reporting any other module that re-derives a run's mode.
# Why and the state table: docs/run-state.md.
[[state_machines]]
name   = "run-lifecycle"
module = "src/jobs/run_state.py"
type   = "RunState"
derive = "derive_run_state"

# [[state_machines]] -- the Board drawer's last-exchange pane. board-exchange-state.js owns the
# four display states and the one derive function; board.js reads and writes the pane only
# through it. Why and the state table: docs/board.md.
[[state_machines]]
name   = "board-exchange"
module = "app/webapp/static/board-exchange-state.js"
type   = "ExchangeState"
derive = "deriveExchangeState"
