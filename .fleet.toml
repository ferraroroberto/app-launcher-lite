# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet_gate.py, which wraps
# scripts/static_ratchet.py: it fails on a duplicate block (jscpd via npx, Python and
# JS) or an unused import/variable (ruff F401,F841) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector
# that cannot run exits 3, which fails the gate as NOT CONFIRMED. Vendored copies are
# duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate runs
# scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py: README.md past its
# size budget or baselined size, or a new history marker (issue reference, dated
# heading, changelog heading) in README.md or docs/**/*.md that is not in
# .docs-ratchet-baseline.json, fails. No generated or dated report folder exists
# under docs/, so nothing is excluded. Exit 3 (a file could not be read) fails as
# NOT CONFIRMED. Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet structure check. The gate
# runs scripts/structure_ratchet.py through scripts/structure_ratchet_gate.py: a file
# past 1,000 lines, a Python/JS function past 100, a directory past 40 modules or a
# src -> app import that is not in .structure-ratchet-baseline.json (or that grew past
# its baselined size) fails, and so does a root folder outside the `shape` above. Every
# offender is baselined at its size today; nothing is excluded to shrink the baseline
# (vendored copies are excluded by the script itself). Exit 3 (part of the tree could
# not be measured) fails as NOT CONFIRMED. Procedure + limits: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet check on issue references
# (`#NNN`) inside product-code comments. The gate runs scripts/comment_ratchet.py
# through scripts/comment_ratchet_gate.py: a file whose count of references in
# comments rose, or a new file carrying any, fails against
# .comment-ratchet-baseline.json. A comment states the present-tense why; the story
# of how the code got here lives in the issue and `git log`. Product code only:
# tests, vendored components and generated files are left out by the script itself.
# Exit 3 (a file could not be scanned) fails as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet check on the agent
# instruction files (CLAUDE.md, AGENTS.md, .claude/rules/*.md, every SKILL.md and the
# docs a skill links to). The gate runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py: a rule hit of the weekly prompt audit's
# deterministic tier (R-01 to R-12, R-14 size caps, R-15 to R-17, R-30, R-34 to R-36,
# R-45) that rose above .instruction-ratchet-baseline.json, or a file past its size
# cap, fails. Existing hits are baselined, never excluded. Exit 3 (a file could not be
# read or a skill description could not be parsed) fails as NOT CONFIRMED. Procedure +
# limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [shot_baseline] -- the scaffold's screenshot baseline. The last stage of
# scripts/verify-before-ship.ps1 runs scripts/shot_baseline.py, which compares the
# PNGs tests/e2e/screens/test_screen_shots.py recaptures (the five work tabs at phone and
# desktop width, light and dark; fictional fixture data, Chromium only) with the ones
# committed under `shots_dir`, fails on a visible change and restores the tree.
# `capture` is the argv after the interpreter. Contract and re-baseline steps:
# project-scaffolding docs/playwright-ui-testing.md ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/screens/test_screen_shots.py", "-q", "-p", "no:cacheprovider"]

[[design.accepted]]
check  = "vendored-tokens"
reason = "vendored components read tokens the app never defines (nav geometry, --layout-*, icon-button --hit-min) and fall back to their own defaults, which are the intended values (#47)"

[[design.accepted]]
check  = "rendered-leg"
reason = "tests/e2e/_geometry.py is not adopted: it would grow the e2e suite and the lite fork stays small (#47)"
