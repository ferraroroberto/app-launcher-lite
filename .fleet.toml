# [windows_only_ratchet] -- scripts/windows_only_ratchet.py fails when a test that needs
# Windows (a Windows-only module or API, a Windows-only environment variable read, or a
# planted .exe under a redirected install folder) has no `windows_only` marker beyond
# .windows-only-ratchet-baseline.json. The Mac nightly's unit leg deselects the marker, so
# an unmarked test passes here and turns the night red. Exit 3 is "not confirmed", never
# clean. Mechanism: project-scaffolding docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled = true

# [port_host_ratchet] -- scripts/port_host_ratchet.py fails when a file's count of port or
# machine-local host literals rises above .port-host-ratchet-baseline.json. A port or host
# lives in ignored config and is read through the resolver listed here, so a clean
# `git pull --ff-only` plus the restart recipe is the whole update. Mechanism:
# project-scaffolding docs/port-host-ratchet.md.
[port_host_ratchet]
enabled   = true
resolvers = ["src/app_config.py"]

# [clean_tree_ratchet] -- scripts/clean_tree_ratchet.py boots a disposable plain-HTTP
# server on a free port with its runtime data in a scratch folder and fails when the boot
# adds, changes or deletes a path .clean-tree-ratchet-baseline.json does not list. The smoke
# never touches the tray or its ports. /healthz answers 200 without a token. Mechanism:
# project-scaffolding docs/clean-tree-ratchet.md.
[clean_tree_ratchet]
enabled      = true
smoke        = ["{python}", "-m", "app.webapp.serve", "--host", "127.0.0.1", "--port", "{port}", "--server", "uvicorn"]
ready_path   = "/healthz"
data_dir_env = "APP_LAUNCHER_DATA_DIR"

[test_weight]
ratio_ceiling = "1.0034"

# ---------------------------------------------------------------------------
# [shot_baseline] -- the scaffold's screenshot baseline. The last stage of
# scripts/verify-before-ship.ps1 runs scripts/shot_baseline.py, which compares
# the PNGs tests/e2e/screens/test_screen_shots.py recaptures (five tabs at phone and
# desktop, light and dark; fictional fixture data, Chromium only) with the ones
# committed under `shots_dir`, fails on a visible change and restores the tree.
# `capture` is the argv after the interpreter. Contract and re-baseline steps:
# project-scaffolding docs/playwright-ui-testing.md ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/screens/test_screen_shots.py", "-q", "-p", "no:cacheprovider"]

# ---------------------------------------------------------------------------
# [e2e] -- diff-proportionate routing for scripts/verify-before-ship.ps1's
# browser phase (#568, migrated to the scaffold classifier in #955).
# scripts/classify_e2e.py is project-scaffolding's classifier copied
# byte-verbatim (`e2e_route.py bootstrap`); every app-launcher routing decision
# lives here. Schema: project-scaffolding docs/e2e-routing.md.
#
# Rules are tried top to bottom, first match wins. A path no rule matches is
# "unclassified" and runs the whole dual-projection suite: uncertainty always
# escalates, never narrows. Labels are echoed into E2E_REASON, and the gate's
# session-host warning keys on the "session-host" labels below, so keep them.
[e2e]
static_pytest_target = "tests/e2e/shell/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# The gate's per-test START/DONE/FAILED history (gitignored): the last 20
# browser runs, appended by scripts/verify-before-ship.ps1 into the PRIMARY
# checkout from whichever checkout ran the gate, because a worktree's own
# webapp/verify-progress.log is overwritten each run and dies with the worktree.
# /e2e-audit reads it for the browser leg's time (fleet-config#1018).
progress_log          = "webapp/verify-progress-history.log"
# Budget for that browser leg, in seconds (#1255): the parallel plus serial
# e2e passes of the latest quiet full-tier run in progress_log, not the whole
# gate. 20 min against ~8.9 min measured 2026-10-03 (508 s parallel + 26 s
# serial; gate total ~12.5 min). The budget is deliberately not ratcheted down
# with the measurement: lowering it is the owner's call (#1376).
# Over it, /e2e fires /e2e-audit; a narrow-routed or overlapped run is
# `unknown`, never `within`. Same rule as test_budget: move it only with a
# written reason.
time_budget_s         = 1200
# The browser suite's node budget: it equals the collected count exactly, and
# tests/unit/repo/test_e2e_test_budget.py fails the build on either side (a
# regrown suite, or a trim that left the number stale). Lite collects Chromium
# only by default, so the count is the Chromium projection's. Lower it with
# every trim; raise it only with a node-for-node reason beside it. 298: the
# History sheet is a new dialog behind the Projects toolbar, and its one test
# shares no setup with an existing node (it mocks /api/progress and drives the
# page clock for the refresh poll). 299: the first-load test holds every
# non-essential source unanswered and pauses the page clock before boot, so it
# can share no page with another node. 300: the Full screen switch and the
# Install as app row share one node because the whole check is one Settings
# page load; it carries the iphone marker, which Chromium-only runs ignore.
# 301: dictation's real recording path needs Chromium's fake microphone and
# a fake strict speech backend, a setup no existing node shares. 302: the
# polling test wraps fetch in an init script to count requests in flight and
# holds routes open, which would taint any page it shared with another node.
# 303: the build readout's restart sheet route-mocks /api/restart before boot
# and changes the live session count between load and tap; no existing node
# opens that sheet, and the refresh, the no-post first tap, the confirmed post
# and the failed-run report all ride that one node. The count today is 303 with
# the request-budget probe, whose page installs a clock and a writable
# visibility state before boot and runs two fake minutes, so no other node
# could share it.
test_budget = 303

# --- static assets under the webapp's static dir -> Chromium smoke ----------
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]
label      = "static-asset"
# A vendored HTML *fragment* (e.g. the icons sprite) is pure markup the smoke
# suite loads, with no behaviour of its own. Non-vendored .html (index.html)
# is a real app page, as is a view fragment under views/, and both fall through
# to full below.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]
label      = "static-asset"

# --- the real browser surface -> full ---------------------------------------
# CSS routes full rather than to a curated "layout subset": styles/*.css is
# global and WebKit is exactly where layout regressions surface, so a
# hand-kept subset would be drift-prone and an under-testing risk.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/static/"
label  = "webapp-static-code"
# The session-host package sits inside app/webapp/, so its rule comes first
# and its diff keeps the "session-host" label the gate warns on.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/session_host/"
label  = "session-host"
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
label  = "webapp"

# --- session-host / launcher on the e2e surface -> full ---------------------
# The e2e suite drives a live session-host, so every module it loads is
# browser surface: the CLAUDE.md `## session-host` import closure (#881, #923),
# plus the launcher entry points. Kept as literal paths rather than parsed
# from CLAUDE.md at classify time on purpose -- a parse failure would narrow
# routing silently. tests/unit/repo/test_classify_e2e.py walks that CLAUDE.md block and
# fails when a declared path stops routing full.
[[e2e.rule]]
tier = "full"
path = "src/clients/session.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/launching/launcher.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/vt_snapshot.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/__init__.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/agents.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/app_config.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/audit.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/runtime_files.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/build_info.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/chief_session_end.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/chief/__init__.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/chief/copilot_state.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/diagnostics.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/env_path.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/git_utils.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/subprocess_flags.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "launcher.py"
label = "session-host/launcher"
# A prefix, not a list, so a future split of the session host
# (e.g. src/session_host_pty.py) routes full without an edit here.
[[e2e.rule]]
tier       = "full"
prefix     = "src/session_host"
extensions = ["py"]
label      = "session-host/launcher"

# --- the CLI dispatcher and the dependency pins -> full ---------------------
# The e2e session-host starts as `launcher.py session-host`, and the webapp's
# jobs router imports app.cli.commands.run_job_cmd. Either import runs
# app/cli/commands/__init__.py, which imports every command module, so a broken
# one stops the disposable stack booting. A pin bump is installed into the venv
# the browser run uses, so it is browser surface too. Both were "unclassified"
# and already ran full; the rules name that.
# Not session-host labels: the gate's session-host warning keys on those.
[[e2e.rule]]
tier       = "full"
prefix     = "app/cli/"
extensions = ["py"]
label      = "cli-dispatcher"
[[e2e.rule]]
tier  = "full"
path  = "requirements.txt"
label = "dependencies"

# --- the e2e suite itself, and the shared root conftest -> full -------------
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
label  = "e2e-test"
[[e2e.rule]]
tier  = "full"
path  = "tests/conftest.py"
label = "shared-conftest"

# --- no browser impact -> no browser suite ----------------------------------
# Deliberate #568 decision, not an oversight: backend src/ code off the
# session-host path has no browser surface of its own. The non-e2e pytest
# suite (TestClient etc.) covers it, and that phase always runs. Do not
# "fix" this by routing all of src/ to full.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
label      = "backend-python"
# Test support the e2e suite itself loads (#1376): a change to one reaches the
# browser run, so it must not fall into the non-e2e-test rule below.
[[e2e.rule]]
tier  = "full"
path  = "tests/_credential_hygiene.py"
label = "e2e-test-support"
[[e2e.rule]]
tier  = "full"
path  = "tests/_progress_log.py"
label = "e2e-test-support"
[[e2e.rule]]
tier  = "full"
path  = "tests/__init__.py"
label = "e2e-test-support"
# The routing table and its classifier decide which browser slice every diff
# runs, so a diff to either must run the suite it reroutes. Both rules sit above
# the `scripts/` and `repo-meta` rules, which would otherwise win first.
[[e2e.rule]]
tier  = "full"
path  = ".fleet.toml"
label = "routing-table"
[[e2e.rule]]
tier  = "full"
path  = "scripts/classify_e2e.py"
label = "routing-table"
# Deliberately NOT here: tests/_pty_frame_text.py, _pty_paint_child.py,
# _pty_readback_child.py and _pty_wait.py. No e2e module or conftest imports
# them (the real-PTY coverage is tests/unit/session_host/test_session_host_pty_realpty.py, outside
# the browser suite), and the root conftest only fingerprints their bytes, so
# the `non-e2e-test` rule below is right and a diff to one runs no browser.

[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
label      = "non-e2e-test"
# Node-run unit tests of the static JS modules; the browser suite never
# executes them (a change to the JS they cover routes full on its own).
[[e2e.rule]]
tier       = "none"
prefix     = "tests/js/"
extensions = ["mjs"]
label      = "non-e2e-test"
# The tray process entry point: the webapp and the e2e fixture never import it
# (only the lazy `tray` CLI command does).
[[e2e.rule]]
tier  = "none"
path  = "app/tray/tray.py"
label = "tray-process"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
label      = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
label  = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
label  = "tooling/config"
# The Copilot side (hooks, chief helpers, lane skills): the webapp never imports
# it, and its own suite runs in the non-e2e phase.
[[e2e.rule]]
tier   = "none"
prefix = "copilot/"
label  = "copilot-side"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
label  = "tooling/config"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
label  = "tooling/config"
[[e2e.rule]]
tier  = "none"
path  = ".ratchets/comment.json"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".ratchets/static.json"
label = "repo-meta"
[[e2e.rule]]
