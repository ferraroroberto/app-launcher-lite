# ---------------------------------------------------------------------------
# [verify] -- the launch recipe the generated verify-app-launcher skill reads
# (project-scaffolding docs/verify-skill.md). `boot` is the session fixture the
# e2e suite boots a disposable webapp + session-host from; ready_path and
# data_dir_env are the generator defaults (/healthz, APP_LAUNCHER_DATA_DIR).
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }

[verify]
boot           = "tests/e2e/conftest.py::_autoboot_server"
live_optin_env = "LAUNCHER_E2E_LIVE"

# ---------------------------------------------------------------------------
# [perf.review] -- what /perf-review times (fleet-config skills/perf-review).
# "Ready" is the Code tab's header status ("5 sessions"): it is empty until the
# sessions answer lands, so a painted shell with no data does not count as
# loaded. The project list is not used: it sits in a section collapsed on load.
[perf.review]
ready_selector = "#homeHeadStatus"

# ---------------------------------------------------------------------------
# [ci.nightly] -- the Mac Mini nightly's settings for this repo (project-
# scaffolding docs/mac-runner.md, "The [ci.nightly] table"). The app is used from
# Windows and from an iPhone, so the web UI, the webapp API and the iPhone
# browser suite run on the Mac. Only a test that needs Windows (ConPTY PTY
# sessions, pywin32 desktop control, the tray, .bat/PowerShell recipes, drive
# paths) carries `@pytest.mark.windows_only`; the unit leg deselects it, the e2e
# conftest deselects it off Windows, and the local gate still runs it. No
# `views`: the simulator smoke needs a `[design.review.synthetic] command`.
[ci.nightly]
python       = "3.14"
requirements = ["requirements.txt"]
samples      = "config"
unit         = ["tests", "--ignore=tests/e2e"]
e2e          = ["tests/e2e", "--e2e-autoboot"]

# ---------------------------------------------------------------------------
# [comment_ratchet] -- the scaffold's no-history-comments ratchet (#1751,
# project-scaffolding#411). scripts/verify-before-ship.ps1 runs
# scripts/comment_ratchet.py, which fails when a file's count of `#NNN` issue
# references inside comments rises above .comment-ratchet-baseline.json.
# Procedure + limits: project-scaffolding docs/comment-ratchet.md. Vendored
# destinations above are excluded by the script itself; tests are built in.
[comment_ratchet]
enabled  = true
baseline = ".ratchets/comment.json"
docstrings = true
history_phrases = true

# ---------------------------------------------------------------------------
# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis
# (project-scaffolding#410). scripts/verify-before-ship.ps1 runs
# scripts/static_ratchet.py, which fails on a duplicate block (jscpd via npx,
# Python and JS), an unused import/variable (ruff F401,F841) or a likely bug or
# security pattern (the ruff B and S families, S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a
# detector that cannot run exits 3, which fails the gate. Vendored copies are
# duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"
exclude  = ["**/_vendored/**"]

# ---------------------------------------------------------------------------
# [docs_ratchet] -- the scaffold's README-size and history-marker ratchet
# (project-scaffolding#420). scripts/verify-before-ship.ps1 runs
# scripts/docs_ratchet.py, which fails when README.md passes 40 KiB or its
# baselined size, or when README.md / docs/**/*.md gains an issue reference, a
# dated heading or a changelog heading beyond .docs-ratchet-baseline.json.
# docs/ holds no generated or dated report folders, so nothing is excluded.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"

# ---------------------------------------------------------------------------
# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage.
# scripts/verify-before-ship.ps1 runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, when a `src` file imports `app`, and when the
# root folders do not match `shape` plus `extra_roots`. Existing offenders are
# baselined at today's size, never excluded; vendored destinations are skipped by
# the script itself. Exit 3 (git unusable, an unparseable file, an unknown shape)
# fails the gate. Where code goes: docs/layout.md; procedure and limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"
# The pinned third-party Mermaid build is not this repo's code to split; the
# glob matches any pinned version of it.
exclude  = ["app/webapp/static/vendor/mermaid-*.min.js"]

# ---------------------------------------------------------------------------
# [instruction_ratchet] -- the scaffold's baseline-and-ratchet lint of the
# fleet's prompt-audit rules over this repo's instruction files (CLAUDE.md,
# AGENTS.md and every SKILL.md plus the docs a skill links to).
# scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py, which fails
# when a file's count of hits for a rule rises above
# .instruction-ratchet-baseline.json or a file passes its size cap. Existing
# hits are baselined at today's count, never excluded. Exit 3 (git unusable, a
# file that is not UTF-8, a fence that never closes, an unreadable skill
# description) fails the gate. Procedure and limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".ratchets/instruction.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# ---------------------------------------------------------------------------
# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check that
# README.md, CLAUDE.md and docs/**/*.md name only repo paths, `python -m`
# modules, relative links and loopback ports that exist.
# scripts/verify-before-ship.ps1 runs scripts/doc_refs_ratchet.py, which fails on
# a dangling reference that .doc-refs-ratchet-baseline.json does not record.
# Exit 3 (git unusable, a file that is not UTF-8, a fence or comment that never
# closes) fails the gate. allow_refs lists the other services' ports the docs
# name on purpose. Procedure and limits: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".ratchets/doc-refs.json"
trees      = true
allow_refs = [
  # Other services' loopback ports the docs name on purpose: the hub, the
  # sibling voice-transcriber and photo-ocr apps, the session-host this repo
  # spawns, task-os, and the Chrome DevTools port the iPhone debugging doc uses.
  ":8000", ":8443", ":8444", ":8466", ":8448", ":9221",
  # `:12` is the example line reference in a file chip's description, not a port.
  ":12",
  # Another repo's files, named as pointers (fleet-config's chief skill, life-os's
  # Claude settings).
  ".claude/skills/chief/SKILL.md", ".claude/settings.json",
]

# ---------------------------------------------------------------------------
# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check that no new
# Python function, class or method appears that nothing in the repo refers to.
# scripts/verify-before-ship.ps1 runs scripts/dead_code_ratchet.py, which fails on
# a definition that .dead-code-ratchet-baseline.json does not record. Exit 3
# (git unusable, a tracked .py file that cannot be read or parsed) fails the
# gate. Files under [vendored] are read for references, never reported.
# entry_decorators and allow name the framework hooks this repo relies on.
# Procedure and limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled          = true
baseline         = ".ratchets/dead-code.json"
entry_decorators = []
# pytest calls `toterminal` on a report's longrepr by duck typing, never by name.
allow            = ["tests/_credential_hygiene.py:_RedactedRepr.toterminal"]

# ---------------------------------------------------------------------------
# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py fails when the web app gains a surface root
# (a <dialog>, a dialog/menu/tabpanel role, a popover) with no constant `data-surface` id, an id
# with no entry in docs/ux-surfaces.yaml, a map entry no element carries, one id on two
# surfaces, a link to an id with no entry, or a docs/ux-surface-map.md page not regenerated from
# the map, beyond .ux-surface-ratchet-baseline.json. Exit 3 is "not confirmed", never clean.
# Mechanism: project-scaffolding docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# [test_weight] -- test-to-code ratchet. scripts/verify-before-ship.ps1
# runs scripts/suite_weight_ratchet.py, which fails when the ratio of code
# lines under tests/ to code lines under src/ + app/ rises above this ceiling.
# Shrink-only: `python -m scripts.suite_weight_ratchet --update` lowers it after
# a trim; `--raise-ceiling` is the one way up, and a raise says in its PR what
# the extra test weight is for.
# The ceiling includes the import header every feature module repeats: the same
# tests weigh a few hundred lines more as small modules than as one giant file.
# ---------------------------------------------------------------------------
# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet
# conventions held as stdlib `ast` rules (project-scaffolding#456).
# scripts/verify-before-ship.ps1 runs scripts/conventions_ratchet.py, which fails
# when a file's count for an enabled rule rises above
# .conventions-ratchet-baseline.json. Enabled: no-window (the launcher spawns on
# Windows), logging-not-print and no-drive-path (src/ and app/ are library code),
# git-wrapper (src/git_utils.py is the one run_git), login-lockout (the /api/login
# route enforces the vendored src/login_lockout.py; baseline zero), no-pwsh-stub (pwsh is a
# 0-byte stub here; text files name the absolute powershell.exe; baseline zero), and
# must_use (every outbound requests call goes through the pooled session in
# src/clients/_loopback_http.py; sqlite3.connect through
# src/runtime_files.py; os.replace through src/_json_io.py or src/runtime_files.py;
# baseline zero), and host-identity (tests read the account name and home folder only
# through tests/host/_synthetic_host.py; baseline zero), and path-sep (a regex-parsed path
# is normalised before a join, since POSIX keeps a backslash; baseline zero). Skipped: secret-compare, since
# hmac.compare_digest is called from six modules and no single helper owns it.
# Exit 3 (git unusable, a .py file that does not parse) fails the gate. Procedure
# and limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled      = true
baseline     = ".ratchets/conventions.json"
rules        = ["no-window", "logging-not-print", "no-drive-path", "git-wrapper", "password-input-vendored", "nav-standalone-head", "login-lockout", "no-pwsh-stub", "subprocess-timeout", "browser-per-iteration", "state-literal", "state-set-repeat", "state-write", "host-identity", "path-sep"]
# copilot/skills/_lib/git_run.py is the Copilot side's own run_git; it sets GIT_OPTIONAL_LOCKS=0 too.
git_wrappers = ["src/git_utils.py", "copilot/skills/_lib/git_run.py"]

[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/clients/_loopback_http.py"]
why    = "CLAUDE.md: outbound-connection discipline, one pooled session (src/clients/_loopback_http.py is this repo's pooled session)"
paths  = ["app/", "src/"]

# Each SQLite store sets its own pragmas on the connection that
# src/runtime_files.py opens, because that helper refuses a path under a code
# folder. The vendored src/usage_log.py is not scanned.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/runtime_files.py"]
why    = "a database opens through src/runtime_files.py, which refuses a path under a code folder"

# A swap that must follow a validation step (the channel profile edit, the chief
# mailbox) calls src/runtime_files.py replace(); a plain atomic JSON write uses
# src/_json_io.py.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/_json_io.py", "src/runtime_files.py"]
why    = "atomic writes go through src/_json_io.py, or src/runtime_files.py replace() when a step sits between the write and the swap"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]
builders = [
  "app/webapp/static/apps.js:runningVerb",
  "app/webapp/static/board/answer-item.js:optionList",
  "app/webapp/static/board/backlog-buckets.js:bucketGroup",
  "app/webapp/static/board/backlog-buckets.js:foldedBucket",
  "app/webapp/static/board/chief-plan.js:foldGroup",
  "app/webapp/static/board/chief-plan.js:planBucketGroup",
  "app/webapp/static/board/drawer.js:drawerAction",
  "app/webapp/static/board/plan-prune.js:boardClearButton",
  "app/webapp/static/board/proof-chip.js:actionButton",
  "app/webapp/static/changes/changes-overlay.js:toolButton",
  "app/webapp/static/chat/ask-option.js:askOption",
]

# [request_budget_ratchet] -- scripts/request_budget_ratchet.py (with its reader
# scripts/request_budget_scan.py) fails when a fixed-rate browser poll that reaches the
# server, a poll under the 2 s floor, an undeclared fast server loop, a directory walk in a
# request handler, a submit to the event loop's shared default pool, or a web app without
# the request-timing middleware is new beyond .request-budget-ratchet-baseline.json. Request
# handlers live under app/webapp/routers. Exit 3 is "not confirmed", never clean.
# Mechanism: project-scaffolding docs/request-budget-ratchet.md; the rules and why:
# docs/polling-budget.md.
[request_budget_ratchet]
enabled      = true
handler_dirs = ["app/webapp/routers"]
stat_cache   = ["src.life_os.stat_cache"]

# Read by tests/e2e/budget/test_main_page_request_budget.py: what the main page may send in
# a visible minute on a frozen clock, hidden being zero. A measured minute is 39 on Chromium
# and 46 on WebKit, which also reads its status, version and theme boot calls inside the
# minute (system load every 10 s, apps, sessions and usage reads on their own ticks); 50
# leaves room for one extra tick and no more, so a new poll shows up as a failure.
[request_budget]
visible_requests_per_minute = 50

# Server loops that wake faster than the ratchet's 5 s floor, or on an interval the
# source does not fix. Each runs only while something waits on it (a request, a launch
# or restart, a send, a live session, a running Job, a poll within the demand window)
# or must act while nobody watches, and then idles cheaply.

[[request_budget.loops]]
path       = "app/cli/commands/run_job_supervision.py"
function   = "ResourceSampler._loop"
interval_s = 1
why        = "samples a running Job's process tree for its CPU and memory report; it exists only while that Job runs"

[[request_budget.loops]]
path       = "app/tray/registered_trays.py"
function   = "_wait_for_tray_ready"
interval_s = 0.5
why        = "bounded wait for a sister tray the owner just launched to bind its port; ends after 30 s"

[[request_budget.loops]]
path       = "app/webapp/chief_doorbell.py"
function   = "tick_forever"
interval_s = 3
why        = "wakes the idle fleet chief when its mailbox fills, which must happen while nobody watches; off by default, and an empty mailbox stops each tick at two directory listings; the fallback wake on the same loop reads the session-host at most once a minute, and nothing at 0"

[[request_budget.loops]]
path       = "app/webapp/demand_cache.py"
function   = "DemandCache.tick_forever"
interval_s = 5
why        = "rebuilds only while a read arrived within the demand window, and does nothing otherwise"

[[request_budget.loops]]
path       = "app/webapp/manager.py"
function   = "WebappManager._await_answer"
interval_s = 0.4
why        = "bounded re-probe of a just-bound webapp port within the startup budget while the tray waits on it"

[[request_budget.loops]]
path       = "app/webapp/manager.py"
function   = "WebappManager.wait_until_ready"
interval_s = 0.4
why        = "bounded wait for the webapp the tray just started to answer; ends at the startup budget"

[[request_budget.loops]]
path       = "app/webapp/routers/board_chief.py"
function   = "_stop_chief_for_respawn"
interval_s = 0.25
why        = "bounded wait inside the owner's respawn request for the old chief to exit, so two chiefs never run; ends after 8 s"

[[request_budget.loops]]
path       = "app/webapp/routers/board_spawn.py"
function   = "_await_dispatch_ready"
interval_s = 0.25
why        = "bounded wait inside a spawn request for the new agent's first output before typing into it; ends after 15 s"

[[request_budget.loops]]
path       = "app/webapp/routers/board_spawn.py"
function   = "_await_pty_quiescent"
interval_s = 0.5
why        = "bounded wait inside a spawn request for the agent's prompt to settle before typing into it; ends after 30 s"

[[request_budget.loops]]
path       = "app/webapp/routers/jobs_run_store_routes.py"
function   = "stream_job_run"
interval_s = 0.1
why        = "tails a Job run's output to the open websocket; it runs only while that client is connected and the run is live"

[[request_budget.loops]]
path       = "app/webapp/routers/session_folder_trust.py"
