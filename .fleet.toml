# --- surfaces (#955, project-scaffolding#258) -------------------------------
# A diff that would route "full" but whose every full- or static-tier path
# sits in ONE surface below runs only that surface's pytest_targets, on both
# projections. A surface owns a tab's own modules and its own tests, nothing
# shared: styles/*.css, index.html, main.js/state.js/api.js/tabs.js and the other
# shared JS, server.py, the session-host paths and both conftests stay out of
# every surface, so a change there still runs the whole suite. So do a path in
# two surfaces, a diff spanning two, any unclassified path, and any diff that
# edits this file or the classifier.
#
# Targets are wider than the owned tests on purpose. Each tab module is
# imported by main.js, so a broken one takes the whole SPA down: test_smoke
# and test_primary_nav (which carries the bottom tab bar's checks since #1215)
# catch that. test_coding_model_selector drives both tabs' model combos
# (claude-options.js imports them), and test_overlay_phone_composer's bar legs share the
# terminal bar's classes with the Life OS doc-browser bar and mirrors the board
# carousel's overflow pattern.
# tests/unit/repo/test_classify_e2e.py pins every surface with a narrowing path and a
# shared path that must stay full, and checks that every e2e test naming a
# surface module is in that surface's targets.

# The Board tab: kanban (board.js), the dispatch bar and fleet-chief
# lifecycle (board-dispatch.js), the chief's answer sheet (board-answers.js),
# the drill-down drawer (board/drawer.js), the Chief's plan card
# (board/chief-plan.js) and its Clear merged control (board/plan-prune.js),
# and their routers. test_coding_chief drives the
# chief from the Coding tab through board-dispatch.js; test_session_rename and
# test_session_row_glance render board cards.
[[e2e.surface]]
name     = "board"
paths    = [
    "app/webapp/static/board.js",
    "app/webapp/static/board/board-dispatch.js",
    "app/webapp/static/board/board-answers.js",
    "app/webapp/static/board/drawer.js",
    "app/webapp/static/board/chief-plan.js",
    "app/webapp/static/board/plan-prune.js",
    "app/webapp/routers/board.py",
    "app/webapp/routers/board_chief.py",
    "app/webapp/routers/board_spawn.py",
    "tests/e2e/board/test_board_tab.py",
    "tests/e2e/board/test_board_nav_badge.py",
    "tests/e2e/board/test_board_job_dismiss.py",
]
prefixes = ["tests/e2e/board/"]
pytest_targets = [
    "tests/e2e/board/test_board_tab.py",
    "tests/e2e/board",
    "tests/e2e/board/test_board_nav_badge.py",
    "tests/e2e/board/test_board_job_dismiss.py",
    "tests/e2e/shell/test_page_headers.py",
    "tests/e2e/shell/test_header_cpu_reading.py",
    "tests/e2e/shell/test_text_size.py",
    "tests/e2e/shell/test_wide_layout.py",
    "tests/e2e/code/test_wide_code_detail.py",
    "tests/e2e/code/test_coding_chief.py",
    "tests/e2e/session/test_session_rename.py",
    "tests/e2e/terminal/test_overlay_phone_composer.py",
    "tests/e2e/shell/test_primary_nav.py",
    "tests/e2e/shell/test_smoke.py",
    "tests/e2e/shell/test_first_load_sources.py",
    "tests/e2e/shell/test_row_name_typography.py",
    "tests/e2e/shell/test_icon_sizes.py",
    "tests/e2e/shell/test_vendored_empty_and_select.py",
    "tests/e2e/shell/test_touch_targets.py",
    "tests/e2e/session/test_session_row_glance.py",
    "tests/e2e/code/test_code_row_status_age.py",
    "tests/e2e/settings/test_settings_sheets.py",
    "tests/e2e/shell/test_action_row_variants.py",
    "tests/e2e/shell/test_async_list_states.py",
    "tests/e2e/screens/test_screen_shots.py",
    "tests/e2e/shell/test_poll_single_flight.py",
