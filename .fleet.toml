# .fleet.toml — this repo's architecture-map card.
# Lite fork: GitHub Copilot CLI + GitLab (glab) edition of app-launcher.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🚀"
port         = ":8465"
display_name = "App Launcher Lite"
description  = "Copilot + GitLab lite fork of app-launcher: the phone-first launcher hub."
depends_on   = ["app-launcher"]
# Root layout (scripts/structure_ratchet.py): the webapp-tray preset lists app, src,
# tests, docs, scripts, data, brand, assets, config and webapp, so no extra root is
# declared. Why: docs/layout.md.
shape        = "webapp-tray"
extra_roots  = []

# index.html:612 is a placeholder example path in the job form, not a dependency.
[contracts]
ignore_refs = [
  { path = "app/webapp/static/index.html", repo = "content-management", why = "input placeholder example path, not a runtime reference" },
  { path = "src/jobs/config.py", repo = "content-management", why = "docstring example of a jobs.json entry, not a runtime reference" },
]

[vendored]
usage-log = { src = "app/webapp/static/_vendored/usage-log", sha = "48f9c5104fbe41b9bfd9f3bc28373efaa7b6056c", dest = "app/webapp/static/_vendored/usage-log" }
