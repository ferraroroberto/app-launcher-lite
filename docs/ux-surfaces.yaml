    links:
      - to: settings.groups
        via: the groups
      - to: settings.document
        via: a document row
      - to: settings.copilot
        via: Coding agent
      - to: settings.chief
        via: Chief
      - to: settings.gitlab
        via: GitLab
      - to: settings.performance
        via: Speed limits
      - to: settings.speech
        via: Speech to text
