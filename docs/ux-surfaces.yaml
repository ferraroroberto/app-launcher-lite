# UX surface map: the single source for docs/ux-surface-map.md.
#
# Every screen, drill-in, menu, sheet, dialog, popover, Settings row, state,
# gesture and key a person can reach in this app, one entry per surface. The
# convention is project-scaffolding's docs/ux-surface-map.md. Edit this file,
# never the generated page; then run `python scripts/ux_surface_map.py`.
#
# A change that adds, removes, renames or reshapes a user-visible surface
# updates its entry here in the same change, adds or removes the matching
# `data-surface` attribute in the code, and regenerates the page.

app: App Launcher Lite

notes: >
  One single-page app: five tabs (Board, Code, Team, Apps, Jobs) in the vendored nav, Settings behind the gear in every tab's header.
  Phone first; at 1100px and wider with a fine pointer the nav is a left rail and the Code tab is a list beside the session view.
  Every sheet is a native dialog with a header close and one full-width primary action. The coding agent is GitHub Copilot CLI and the forge is GitLab, so the Board lists GitLab issues and merge requests and the Code tab launches Copilot.
  Features that need a folder or a registry (Team OS skills, mini apps, the chief) show their empty state until Settings points at one.
  Ids are `<area>.<surface>`; the e2e capture hook takes the same ids.

walk:
  date: 2026-11-18
  build: 52a7d40
  widths: [390, 1280]
  themes: [light, dark]

areas:
  - id: chrome
    title: Chrome
    notes: What every tab shares - the nav, each tab's header, the toast and the dialogs any tab can raise.
  - id: code
    title: Code
    notes: The default tab. The session list and the project list; a session opens in the terminal overlay.
  - id: terminal
    title: Terminal
    notes: The session overlay in its terminal mode - the live PTY, the composer under it, the menus on the bar.
  - id: chat
    title: Chat
    notes: The session overlay in its chat mode - the same session read from the agent's own history.
  - id: screen
    title: Screen
    notes: The PC's desktop, live, behind the terminal's passkey gate.
  - id: apps
    title: Apps
  - id: jobs
    title: Jobs
  - id: team
    title: Team OS
  - id: board
    title: Board
  - id: settings
    title: Settings
    notes: A group list in a pane; every row that holds more than a switch opens a sheet with a back arrow to the pane.
  - id: keys
    title: Keys and gestures
    notes: Inputs that are not elements.

surfaces:
  # ------------------------------------------------------------------ chrome
  - id: chrome.nav
    area: chrome
    title: Primary navigation
    root: data-surface
    reach:
      - always on screen
    holds:
      - five tabs in order Board, Code, Team, Apps, Jobs, each an icon and a label
      - a count badge on the Board tab while something waits on the owner
    does:
      - switches the pane and keeps the choice in the page state
      - a tab switch leaves Settings and, in the wide layout, closes the docked session view when Code is left
    why: the fleet navigation contract; Settings is no tab, the header gear opens it
    phone: a floating pill at the bottom edge
    desktop: a left rail 80px wide
    links:
      - to: board.tab
        via: Board
      - to: code.tab
        via: Code
      - to: team.tab
        via: Team
      - to: apps.tab
        via: Apps
      - to: jobs.tab
        via: Jobs

  - id: chrome.home-head
    area: chrome
    title: Tab header
    root:
      none: the same vendored home-head markup sits at the top of all six panes, so no single id can name it.
    reach:
      - the top of every tab and of Settings
    holds:
      - the tab's icon and title
      - one status line that names only exceptions, worst first, and falls back to a plain count
      - the CPU reading button, a muted percentage that takes a tone at 70 and 90 percent and shows a dash when the server could not read it
      - the theme toggle
      - the Settings gear
    does:
      - the CPU reading opens the PC load sheet
      - the theme toggle flips light and dark and keeps the choice
      - the gear opens Settings
    states:
      - the gear is the only way into Settings; Settings itself shows no gear
    links:
      - to: chrome.cpu-sheet
        via: CPU reading
      - to: settings.pane
        via: gear

  - id: chrome.cpu-sheet
    area: chrome
    title: PC load sheet
    root: data-surface
    reach:
      - the CPU reading in any tab header
    holds:
      - the PC's private IP address
      - the load reading and what is using it
      - a Screen row with a View live action
      - a toast area for the result of a copy
      - Done
    does:
      - Copy on the IP row puts the address on the clipboard
      - View live opens the Screen view
    states:
      - Unknown instead of an address, with Copy disabled, when the PC's address could not be read
    links:
      - to: screen.view
        via: Screen View live

  - id: chrome.toast
    area: chrome
    title: Toast
    root: data-surface
    reach:
      - shown by an action's result, a copy, a long-press hint or a context ring tap
    holds:
      - one status line that dismisses itself
    states:
      - lives on the body, outside the app wrapper, so the nav cannot clip it

  - id: app.update-banner
    area: chrome
    title: New version banner
    root: data-surface
    reach:
      - appears by itself when the server reports a build other than the one the page booted on
    holds:
      - the text New version available
      - Reload
      - a dismiss button
    does:
      - Reload reloads the page; it is only ever the user's tap
      - dismiss keeps it down until the server moves to yet another build
    states:
      - a server back on the boot build hides it
    why: the vendored build-watch component stamps this id itself, and every fleet app lists it

  - id: shared.login
    area: chrome
    title: Sign-in sheet
    root:
      none: the vendored sign-in component builds the sheet itself and this copy does not stamp an id.
    reach:
      - raised by any request the server answers with 401
    holds:
      - a password field and the sign-in action
    does:
      - a successful sign-in stores the token and boots the page again
    states:
      - only one sheet is open however many requests fail at once

  - id: chrome.confirm-dialog
    area: chrome
    title: Confirm dialog
    root: data-surface
    reach:
      - stopping a session or a running app, removing a job, running a job that asks for confirmation, and other destructive or costly actions
    holds:
      - a title and a message
      - an optional typed-confirmation field
      - the Confirm action
    does:
      - Confirm resolves the action; the header close or Escape cancels it
    why: one themed dialog stands in for the browser's confirm so a phone shows the same sheet everywhere

  - id: chrome.detail-empty
    area: chrome
    title: No session open
    root: data-surface
    reach:
      - the Code tab in the wide layout while no session is open
    holds:
      - No session open and the line A session opens here, beside the list
    states:
      - hidden below 1100px and on a coarse pointer
    desktop: the detail pane's resting state

  - id: chrome.build-readout
    area: chrome
    title: Build readout
    root: data-surface
    reach:
      - the foot of every pane
    holds:
      - the build identity of the running server
    why: the vendored page-foot, so a phone shows which build it is looking at

  # -------------------------------------------------------------------- code
  - id: code.tab
    area: code
    title: Code tab
    root: data-surface
    reach:
      - the Code tab
      - the page's default tab
    holds:
      - the tab header
      - the Usage card
      - the Sessions card
      - the Projects card
    desktop: the list sits left of the docked session view
    links:
      - to: code.usage
        via: Usage
      - to: code.sessions
        via: Sessions
      - to: code.projects
        via: Projects
      - to: chrome.home-head
        via: header

  - id: code.usage
    area: code
    title: Usage
    root: data-surface
    reach:
      - the first card on the Code tab
    holds:
      - the pace words beside the title, under pace or ahead of pace in their tone
      - one Copilot · Month row with a bar filled to the share of the monthly allowance used, a tick at the share of the month gone, the percent and the reset date
      - a footnote with today's credits on this machine, or the reason the usage log could not be read
    does:
      - the bar is accent on or under pace, attention ahead of it and danger at 90% or more
      - an unreadable usage log reads unknown with its reason, never 0%
      - the row's tooltip names the source, the Copilot CLI usage log on this machine, and its scope
      - reads every 60 s while the Code tab is on screen, never during page load
    why: one glance says whether the month's Copilot allowance will last

  - id: code.sessions
    area: code
    title: Sessions
    root: data-surface
    reach:
      - the second card on the Code tab, open by default
    holds:
      - the chief's row first, running or stopped
      - one row per session this launcher started, with an avatar, a one-line title and a status line
      - on a Copilot row whose screen shows its AI credits, the figure beside the age
      - a kebab on every row
    does:
      - a row's tap opens the session in the terminal overlay, or in Chat when Open in Chat is on
      - a stopped chief row offers Start and Resume
    states:
      - empty - No sessions launched from here yet, with a Show projects action that opens the Projects card
    links:
      - to: terminal.overlay
        via: row tap
      - to: code.session-menu
        via: row kebab
      - to: code.chief-menu
        via: stopped chief kebab

  - id: code.session-menu
    area: code
    title: Session menu
    root: data-surface
    reach:
      - a session row's kebab
    holds:
      - Terminal and Chat
      - Links
      - Open in new window
      - Copy path
      - Rename
      - Stop, in the danger tone
      - for the running chief, Restart and Chief settings
    does:
      - Terminal and Chat open the overlay in that mode
      - Stop asks for confirmation, then kills the session
    links:
      - to: terminal.links-sheet
        via: Links
      - to: terminal.rename-dialog
        via: Rename
      - to: chrome.confirm-dialog
        via: Stop
      - to: settings.chief
        via: Chief settings

  - id: code.chief-menu
    area: code
    title: Stopped chief menu
    root: data-surface
    reach:
      - the kebab on the chief's row while no chief runs
    holds:
      - Chief settings; Restart is hidden while nothing runs
    links:
      - to: settings.chief
        via: Chief settings

  - id: code.projects
    area: code
    title: Projects
    root: data-surface
    reach:
      - the second card on the Code tab, closed by default
    holds:
      - the launch toolbar, with a launch preset dropdown when a preset is saved
      - History, Sync all and Refresh for the git check
      - a filter box with a favorites toggle
      - one row per project folder, with its git flag
      - the time of the last git check
    does:
      - a project row launches the coding agent in that folder
      - a preset picked in the toolbar launches it on that preset's model, effort and context
      - Refresh fetches every remote and re-reads branch, changes and ahead or behind
      - Sync all fast-forwards every clean project that is only behind
      - History opens the History sheet
    states:
      - empty - No projects found, with an Open Settings action that opens the Folders sheet
      - filtered to nothing - No projects match the filter, with Clear filter
      - the favorites toggle narrows the list to starred projects
    links:
      - to: code.project-menu
        via: row kebab
      - to: code.preset-menu
        via: preset dropdown
      - to: code.git-sync-sheet
        via: Sync all
      - to: code.history-sheet
        via: History
      - to: settings.folders
        via: Open Settings
      - to: terminal.overlay
        via: row tap

  - id: code.preset-menu
    area: code
    title: Launch preset menu
    root: data-surface
    reach:
      - the preset dropdown first on the Projects launch toolbar, drawn only once a preset is saved for a model on the Copilot list
    holds:
      - Default and one row per saved preset, each named with its effort and context tier
    does:
      - picking a row sets the model, effort and context the next launch sends, and is remembered on this device
      - Default sends nothing extra, so the saved Copilot settings apply

  - id: code.project-menu
    area: code
    title: Project menu
    root: data-surface
    reach:
      - a project row's kebab
    holds:
      - the issues link, Open in VS Code, Show changes, Pull and Open folder
    does:
      - items the project cannot do are greyed with a hint
      - Show changes opens the working-tree overlay
    links:
      - to: code.changes-overlay
        via: Show changes

  - id: code.git-sync-sheet
    area: code
    title: Sync all sheet
    root: data-surface
    reach:
      - Sync all in the Projects card
    holds:
      - the result of the run, project by project
      - Done
    does:
      - Done closes the sheet

  - id: code.history-sheet
    area: code
    title: History sheet
    root: data-surface
    reach:
      - History in the Projects card toolbar
    holds:
      - a day, week or month grouping and a range of 30 days, 90 days, 6 months or a custom pair of days
      - tiles for lines added and removed, merge requests merged and issues opened and closed, each with a chart
      - a per-project table sortable by column
      - the data sources, each with its age, and the projects skipped for having no GitLab remote
      - Refresh and Done
    does:
      - opens on the saved figures at once, however old, and makes no git or GitLab call
      - Refresh re-reads local git and GitLab for every project, with a toast while it runs, then updates in place
      - a column header sorts the project table
      - Done or the header close closes the sheet
    states:
      - loading - Reading the history, until the first answer
      - error - Could not read the history, with Retry, when no figure has loaded yet
      - stale - the last figures stay under a stale line when a later read fails
      - a source that was never read shows unknown, one whose last read failed shows stale, a project with no GitLab remote shows skipped; none of them is drawn as zero
      - a GitLab read that filled a page of 100 says older days may be incomplete

  - id: code.changes-overlay
    area: code
    title: Changes overlay
    root: data-surface
    reach:
      - Show changes in the project menu
      - Changed files in a session menu
      - a file chip or the Edited N files card in Chat
    holds:
      - a title, a refresh button and a close
      - one collapsible row per file with a status badge, the path and plus or minus counts
      - a diff that loads the first time its row opens
    does:
      - a project shows git's unified diff, tinted per line; a session shows each of its own edits in order, folded from the transcript
      - a session also lists files only git status shows it changed (a command wrote them), marked from git status, with git's diff
      - nothing here stages, commits or discards
    states:
      - empty - nothing changed
      - loading and error lines in a status strip
    links:
      - to: code.changes-file-menu
        via: file kebab

  - id: code.changes-file-menu
    area: code
    title: Changed file menu
    root: data-surface
    reach:
      - a file row's kebab in the changes overlay
    holds:
      - Copy content, Copy diff, Copy path, Open on PC

  # ---------------------------------------------------------------- terminal
  - id: terminal.overlay
    area: terminal
    title: Session overlay
    root: data-surface
    reach:
      - a session row, a project launch, the Board drawer's Terminal or Chat, a ?session= link
    holds:
      - a bar with Back, the session title, the model chip, the context ring, the Terminal and Chat toggle and the session menu
      - the terminal host and its composer
      - a status strip
    does:
      - Back closes the overlay
      - the toggle swaps Terminal and Chat without reconnecting
    states:
      - a session with no transcript reader offers no Chat
      - the model chip hides when the model is not known
      - the context ring hides when the agent's screen shows no context figure, as on a Copilot session too narrow for its status line
      - a Copilot session whose footer shows its AI credits gets a label beside the ring, such as 9% · 5.6 AIC
    phone: covers the page
    desktop: docks beside the session list in the wide layout
    links:
      - to: terminal.host
        via: Terminal mode
      - to: terminal.model-sheet
        via: model chip
      - to: terminal.context-sheet
        via: context ring
      - to: chat.overlay
        via: Chat mode
      - to: terminal.session-menu
        via: bar kebab

  - id: terminal.host
    area: terminal
    title: Terminal
    root: data-surface
    reach:
      - the Terminal side of the overlay toggle
    holds:
      - the xterm screen
      - a Jump to latest button once scrolled back
      - the composer bar
      - a status strip and an activity line
    does:
      - the page connects the PTY lazily and a reconnect redraws from the kept history
    links:
      - to: terminal.keys-popover
        via: keys button
      - to: terminal.attach-menu
        via: attach button

  - id: terminal.session-menu
    area: terminal
    title: Overlay session menu
    root: data-surface
    reach:
      - the kebab on the overlay bar
    holds:
      - Rename, Copy link, Changed files, Links
      - in Chat mode Show or Hide steps, Show or Hide automatic, Load new and Reload
      - Compact, for a Copilot session
      - Stop and kill
    does:
      - Compact sends /compact to the session and toasts the host's verdict
    links:
      - to: terminal.rename-dialog
        via: Rename
      - to: terminal.links-sheet
        via: Links
      - to: code.changes-overlay
        via: Changed files
      - to: chrome.confirm-dialog
        via: Stop and kill

  - id: terminal.context-sheet
    area: terminal
    title: Session usage sheet
    root: data-surface
    reach:
      - the context ring in the session view's bar
    holds:
      - the context window used, as a percentage
      - the AI credits used this session, only when a Copilot footer shows them
    does:
      - Done closes

  - id: terminal.model-sheet
    area: terminal
    title: Switch model sheet
    root: data-surface
    reach:
      - the model chip in the session view's bar, shown for a Copilot session
    holds:
      - a note saying the switch is for this session only and the Settings default stays
      - one row per model on the Copilot list, the current one checked
    does:
      - a pick types Copilot's own /model for this session and waits for its event log to report the change
      - Done closes
    states:
      - a switch the server could not confirm leaves the old model showing and says why
      - a busy Copilot, unsent prompt text or an open menu refuses the switch before anything is typed

  - id: terminal.rename-dialog
    area: terminal
    title: Rename session
    root: data-surface
    reach:
      - Rename in either session menu
    holds:
      - a field whose blank value means the automatic title
      - Save

  - id: terminal.links-sheet
    area: terminal
    title: Links sheet
    root: data-surface
    reach:
      - Links in either session menu
    holds:
      - the artifacts and URLs the transcript mentioned, in groups Artifacts, GitHub, Servers and previews, Other
      - each group folded to its name and count, newest row first
      - a note on how far back the read reached with Read more
      - Done
    does:
      - a row opens the link in a new tab and its copy button copies the URL
      - credential-looking query strings were already removed by the server

  - id: terminal.keys-popover
    area: terminal
    title: On-screen keys
    root: data-surface
    reach:
      - the keys button in the composer
    holds:
      - arrow keys, Esc, Tab and Enter
      - sticky Shift and Ctrl, only one engaged at a time
    does:
      - each key writes its escape sequence down the PTY input channel
      - the popover stays open across arrow and Tab taps
    why: phone keyboards that lack these keys still need an agent's prompts to be navigable

  - id: terminal.attach-menu
    area: terminal
    title: Attach menu
    root: data-surface
    reach:
      - the attach button on a composer
    holds:
      - Photo, Extract text (OCR), Attach file (to context) and Attach large file (not read)
    does:
      - an upload stores the file on the PC and puts its path in the message
      - several picks queue behind each other and show N of M
    why: the composer is shared by the terminal, Chat, the Board drawer and the answer sheet

  # -------------------------------------------------------------------- chat
  - id: chat.overlay
    area: chat
    title: Chat pane
    root: data-surface
    reach:
      - the Chat side of the overlay toggle
      - Open in Chat
    holds:
      - the transcript, newest page first, with Load older
      - a Latest button once scrolled up
      - the queued-messages chip
      - the composer
    does:
      - the agent's replies and the user's prompts show expanded and everything else folds into one step line per run
    states:
      - empty, loading and error lines in the transcript state strip
      - a detached session has no terminal, so a note says delivery is typed into the PC console and not confirmed
    links:
      - to: chat.queued-sheet
        via: queued chip
      - to: chat.lightbox
        via: image thumbnail
      - to: chat.html-viewer
        via: HTML document card
      - to: chat.decision-cards
        via: the agent asks
      - to: chat.turn-cards
        via: a finished turn

  - id: chat.decision-cards
    area: chat
    title: Question and plan cards
    root:
      none: drawn inside the transcript list, which carries no id of its own for a card.
    reach:
      - while the agent asks a question or waits on a plan
    holds:
      - the question card with numbered options, an Other field and Done
      - the plan card, answered from the terminal's own screen
      - the resume card, a searchable list of the project's conversations, shown while the terminal's picker is open
    does:
      - an option sends its answer into the session

  - id: chat.turn-cards
    area: chat
    title: Turn cards and step lines
    root:
      none: rows in the transcript list, drawn by the transcript renderer without a root of their own.
    reach:
      - every finished turn
    holds:
      - the Edited N files card with a total and one row per file, showing the first few and Show N more
      - file chips in a reply
      - one step line per run of tool calls, opening item by item
      - a divider row that folds turns nobody typed
    does:
      - a file row or the card header opens the changes overlay
    links:
      - to: code.changes-overlay
        via: file row

  - id: chat.queued-sheet
    area: chat
    title: Queued messages
    root: data-surface
    reach:
      - the queued chip in the Chat pane
    holds:
      - the messages the session holds that the agent has not taken yet
      - a Discard on each
      - Done
    states:
      - empty - The agent has taken everything

  - id: chat.lightbox
    area: chat
    title: Image lightbox
    root: data-surface
    reach:
      - a transcript thumbnail
    holds:
      - the full-size image and a close button
    does:
      - a tap anywhere dismisses it

  - id: chat.html-viewer
    area: chat
    title: HTML viewer
    root: data-surface
    reach:
      - a sent HTML document's card
    holds:
      - the file name, a close button, the document and a Download link
    does:
      - the document shows without scripts, in a frame with an empty sandbox
    why: an HTML document never renders same-origin or scriptable

  # ------------------------------------------------------------------ screen
  - id: screen.view
    area: screen
    title: Screen view
    root: data-surface
    reach:
      - View live in the PC load sheet
    holds:
      - the live frame of the PC's desktop
      - modes View, Control, Touch and Trackpad
      - a keyboard button, a quality button and a handle that shows or hides the controls
      - a keys bar with Esc, Tab, Ctrl, Alt, Win, Del, the F keys, Task Mgr, Paste to PC and Paste plus Ctrl+V
    does:
      - the server sends a frame only when the screen changes, so a still picture is a quiet socket
      - capture runs only while a viewer is connected
    states:
      - reconnecting and unavailable states
    phone: opens full screen
    desktop: pops out into its own window, /?screen=1
    links:
      - to: screen.quality-sheet
        via: Quality
      - to: screen.paste-sheet
        via: Paste to PC
      - to: screen.readout
        via: readout switch

  - id: screen.paste-sheet
    area: screen
    title: Paste to PC sheet
    root: data-surface
    reach:
      - Paste to PC when the phone does not let the page read its clipboard
    holds:
      - a text box and Send to PC

  - id: screen.quality-sheet
    area: screen
    title: Quality sheet
    root: data-surface
    reach:
      - the Quality button in the Screen view
    holds:
      - the quality choices
      - the Readout switch
      - Done

  - id: screen.readout
    area: screen
    title: Readout
    root:
      none: a line drawn inside the Screen view while the Readout switch is on.
    reach:
      - the Readout switch in the quality sheet
    holds:
      - frames a second, data a second, the average frame size and the time from confirming to the picture

  # -------------------------------------------------------------------- apps
  - id: apps.tab
    area: apps
    title: Apps tab
    root: data-surface
    reach:
      - the Apps tab
    holds:
      - the tab header
      - Running, Other ports, Apps, Trays and Mini apps cards
    links:
      - to: apps.running
        via: Running
      - to: apps.other-ports-card
        via: Other ports
      - to: apps.apps
        via: Apps
      - to: apps.trays
        via: Trays
      - to: apps.mini-apps
        via: Mini apps

  - id: apps.running
    area: apps
    title: Running
    root: data-surface
    reach:
      - the first card on the Apps tab
    holds:
      - one row per app launched from here, with a kebab
      - an Other ports row that opens the sheet
      - an idle line and the note Only apps launched from here appear
    states:
      - empty - Nothing launched from here is running, with Show apps
      - an error line in a status strip
    links:
      - to: apps.running-menu
        via: row kebab
      - to: apps.other-ports-sheet
        via: Other ports

  - id: apps.running-menu
    area: apps
    title: Running app menu
    root: data-surface
    reach:
      - a running app's kebab
    holds:
      - a header line with the process id
      - Copy URL and Stop
    links:
      - to: chrome.confirm-dialog
        via: Stop

  - id: apps.other-ports-card
    area: apps
    title: Other ports card
    root: data-surface
    reach:
      - the Apps tab in the wide layout
    holds:
      - the listeners on common app ports that this launcher did not start
    desktop: a card beside the lists
    phone: the Other ports row in Running opens the same list as a sheet
    links:
      - to: apps.listener-menu
        via: row kebab

  - id: apps.other-ports-sheet
    area: apps
    title: Other ports sheet
    root: data-surface
    reach:
      - the Other ports row in the Running card
    holds:
      - the listeners
      - Check again
    states:
